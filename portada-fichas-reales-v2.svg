      <text x="78" y="365">890</text><text x="78" y="383">−  652</text><line class="blue" x1="42" y1="391" x2="84" y2="391"/><text x="151" y="365">604</text><text x="151" y="383">−  62</text><line class="blue" x1="115" y1="391" x2="157" y2="391"/><text x="224" y="365">811</text><text x="224" y="383">−  217</text><line class="blue" x1="188" y1="391" x2="230" y2="391"/><text x="297" y="365">712</text><text x="297" y="383">−  404</text><line class="blue" x1="261" y1="391" x2="303" y2="391"/></g>
    <text class="muted small" x="155" y="424" text-anchor="middle">Ficha A4 preparada para imprimir</text>
