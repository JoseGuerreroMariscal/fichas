<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">Fichas escolares imprimibles de FichasFácil</title>
  <desc id="desc">Vista de varias fichas A4 reales con matemáticas, geometría y caligrafía.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#102747" flood-opacity=".24"/></filter>
    <style>.paper{fill:#fff;stroke:#dbe4ee;stroke-width:2}.navy{fill:#20385f}.muted{fill:#718198}.gold{fill:#9b6b00}.rule{stroke:#aab7c5;stroke-width:1}.blue{stroke:#315c9b;stroke-width:2;fill:none}.red{stroke:#ef9b9b;stroke-width:1.5}.dash{stroke:#b7c4d2;stroke-width:1;stroke-dasharray:3 3}.title{font:700 17px Arial,sans-serif}.small{font:10px Arial,sans-serif}.body{font:12px Arial,sans-serif}.math{font:13px monospace;fill:#20385f}</style>
  </defs>
  <g transform="translate(48 57) rotate(-8 120 205)" filter="url(#shadow)">
    <rect class="paper" width="240" height="366" rx="5"/>
    <text class="gold" x="120" y="27" text-anchor="middle" font-size="9" font-family="Arial" font-weight="700" letter-spacing="1.5">GEOMETRÍA</text><text class="navy title" x="120" y="50" text-anchor="middle">Observa y responde</text>
    <text class="muted small" x="18" y="70">Nombre:</text><line class="rule" x1="52" y1="70" x2="142" y2="70"/><text class="muted small" x="161" y="70">Fecha:</text><line class="rule" x1="193" y1="70" x2="222" y2="70"/><line class="rule" x1="18" y1="82" x2="222" y2="82"/>
    <polygon points="120,111 82,169 158,169" fill="#e9f1fb" stroke="#315c9b" stroke-width="2.5"/><text class="navy body" x="18" y="198" font-weight="700">1. ¿Cuántos lados tiene?</text><line class="blue" x1="20" y1="220" x2="220" y2="220"/><line class="dash" x1="20" y1="233" x2="220" y2="233"/><line class="red" x1="20" y1="246" x2="220" y2="246"/>
    <circle cx="120" cy="295" r="31" fill="#f7fafc" stroke="#315c9b" stroke-width="2.5"/><circle cx="120" cy="295" r="3" fill="#ef8e69"/><text class="navy body" x="18" y="339" font-weight="700">2. Identifica la figura.</text>
  </g>
