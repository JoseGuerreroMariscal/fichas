<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Generador gratuito de fichas educativas para imprimir." />
    <title>Generador de fichas · Fichalia</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="./">Fichalia</a>
      <span class="header-note">Fichas educativas para imprimir</span>
    </header>

    <main class="page-shell">
      <section class="intro" aria-labelledby="page-title">
        <h1 id="page-title">Generador de fichas</h1>
        <p>Elige una actividad, configura la dificultad y genera tu ficha lista para imprimir.</p>
      </section>

      <section class="generator-card" id="generator" aria-labelledby="generator-title">
        <div class="card-heading">
          <h2 id="generator-title">Crear una ficha</h2>
          <p>Solo tienes que elegir las opciones que necesitas.</p>
        </div>

        <div class="quick-types" aria-label="Elegir actividad rápidamente">
          <button type="button" class="quick-type is-selected" data-type="sumas">＋ Sumas</button>
          <button type="button" class="quick-type" data-type="restas">− Restas</button>
          <button type="button" class="quick-type" data-type="multiplicaciones">× Multiplicaciones</button>
          <button type="button" class="quick-type" data-type="divisiones">÷ Divisiones</button>
        </div>

        <form id="generator-form">
          <div class="form-grid">
            <label>Actividad
              <select id="activity">
                <option value="sumas">Sumas</option>
                <option value="restas">Restas</option>
                <option value="multiplicaciones">Multiplicaciones</option>
                <option value="divisiones">Divisiones</option>
                <option value="problemas">Problemas matemáticos</option>
                <option value="lectura">Lectura comprensiva</option>
              </select>
            </label>
            <label>Curso
              <select id="level">
                <option>Infantil</option><option>1.º Primaria</option><option>2.º Primaria</option>
                <option>3.º Primaria</option><option>4.º Primaria</option><option>5.º Primaria</option><option>6.º Primaria</option>
              </select>
            </label>
            <label>Dificultad
              <select id="difficulty"><option>Tranquila</option><option>Estándar</option><option>Un poquito más</option></select>
            </label>
            <label>Número de ejercicios
              <select id="count"><option value="10">10 ejercicios</option><option value="15">15 ejercicios</option><option value="20" selected>20 ejercicios</option></select>
            </label>
          </div>

          <label class="check-row"><input id="solutions" type="checkbox" /> <span>Incluir soluciones en una segunda página</span></label>
          <input id="student" type="hidden" value="" />
          <input id="theme" type="hidden" value="" />
          <button class="generate-button" type="submit">Generar ficha <span>→</span></button>
        </form>
        <div class="preview-result" id="preview-result"></div>
      </section>

      <section class="steps" aria-label="Cómo funciona">
        <div><strong>1</strong><span>Elige la actividad</span></div>
        <div><strong>2</strong><span>Configura la ficha</span></div>
        <div><strong>3</strong><span>Imprime</span></div>
      </section>
    </main>

    <footer class="site-footer">Fichalia · Sin registro y gratis</footer>
    <script src="app.js"></script>
  </body>
</html>
